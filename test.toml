# MSG2 Decoder Configuration File
# This file configures the 5G NR RAR (Random Access Response) decoder

[log]
level = "info"  # Options: error, warning, info, debug

[rf]
# RF Device Configuration
device_name = "file"              # Options: "uhd", "zmq", "file"
device_args = "type=b200"        # Device-specific arguments
file_path = "/home/sushant/Wireless/uhd_iq_data.fc32"                   # Path to IQ file (only for device_name = "file")

# RF Parameters
rx_gain = 40.0                   # Receiver gain in dB
tx_gain = 80.0                   # Transmitter gain in dB (not used for RX-only)
srate = 23.04e6                  # Sample rate in Hz

# Frequency Configuration
dl_frequency = 1842.5e6          # Downlink frequency in Hz (Band 3 FDD)
ul_frequency = 1770.0e6          # Uplink frequency in Hz (Band 3 FDD)
ssb_frequency = 1842.05e6        # SSB center frequency in Hz

# Cell Parameters
nof_prb = 106                    # Number of Physical Resource Blocks (20 MHz = 106 PRBs)
cell_id = 1                      # Physical Cell ID (N_ID)
band = 3                         # 3GPP Band number

[ssb]
# Synchronization Signal Block Configuration
scs = 15                         # Subcarrier spacing in kHz (15 or 30)
pattern = "A"                    # SSB pattern: "A" for FDD, "B" or "C" for TDD
duplex_mode = "FDD"              # Duplex mode: "FDD" or "TDD"
period_ms = 10                   # SSB periodicity in milliseconds

# SSB Detection Parameters
window_size_ms = 40              # Detection window size in milliseconds
step_size_ms = 1                 # Step size for sliding window in milliseconds
overlap_ms = 1                   # Overlap between windows in milliseconds
max_search_steps = 1000          # Maximum number of search steps

[prach]
# Physical Random Access Channel Configuration
config_idx = 1                   # PRACH configuration index (0-255)
                                 # Determines PRACH format and time resources
                                 # Common values:
                                 #   1: Format A1, even slots (0,2,4,6,8) - typical for FDD
                                 #   16: Format B1, slot 1
                                 #   27: Format A1/B1, slot 4
                                 #   52: Format C0, slot 1
is_nr = true                     # Set to true for 5G NR
hs_flag = false                  # High-speed flag
root_sequence_index = 1          # Root sequence index
zero_correlation_zone = 0        # Zero correlation zone config
freq_offset = 0                  # PRACH frequency offset
num_ra_preambles = 64            # Number of RA preambles

[rar]
# Random Access Response Configuration
# Note: ra_rnti_list is now calculated automatically from PRACH config
coreset0_idx = 0                 # CORESET0 index from MIB (0-15)
ss0_idx = 0                      # Search Space 0 index from MIB (0-15)
offset_to_carrier = 0            # Offset to carrier in PRBs
ssb_offset = 0                   # SSB subcarrier offset (kSSB)
dmrs_typeA_pos = 2               # DMRS Type A position (2 or 3)
nof_rx_antennas = 1              # Number of receive antennas

# Example configurations for different devices:

# UHD (USRP B200/B210):
# device_name = "uhd"
# device_args = "type=b200"

# ZMQ (Network simulation):
# device_name = "zmq"
# device_args = "tx_port=tcp://*:2000,rx_port=tcp://localhost:2001,id=ue,base_srate=23.04e6"

# File input:
# device_name = "file"
# file_path = "/path/to/iq_samples.fc32"
